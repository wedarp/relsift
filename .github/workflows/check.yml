name: constraint-experiments

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.19.0'
      - name: Install pinned compiler and core
        shell: bash
        run: |
          set -euo pipefail
          install_dir="$RUNNER_TEMP/relsift-moon"
          archive_dir="$RUNNER_TEMP/relsift-downloads"
          mkdir -p "$install_dir" "$archive_dir"
          version='0.10.20%2B65efd5b93'
          curl --fail --location --retry 3 "https://cli.moonbitlang.com/binaries/$version/moonbit-linux-x86_64.tar.gz" -o "$archive_dir/toolchain.tar.gz"
          curl --fail --location --retry 3 "https://cli.moonbitlang.com/cores/core-$version.tar.gz" -o "$archive_dir/core.tar.gz"
          echo "80d987523308fa490eba9f1baf98df996a5a7891e118357553b7c2608c0597c5  $archive_dir/toolchain.tar.gz" | sha256sum --check
          echo "8ec2a2c01335501d703867bb4eef5f92d3cd7e1ae1ee5f7f14d54d16d2c7c2b5  $archive_dir/core.tar.gz" | sha256sum --check
          tar -xzf "$archive_dir/toolchain.tar.gz" -C "$install_dir"
          tar -xzf "$archive_dir/core.tar.gz" -C "$install_dir/lib"
          chmod +x "$install_dir/bin/"* "$install_dir/bin/internal/tcc"
          export MOON_HOME="$install_dir"
          export PATH="$install_dir/bin:$PATH"
          moon -C "$install_dir/lib/core" bundle --warn-list -a --all
          moon -C "$install_dir/lib/core" bundle --warn-list -a --target wasm-gc --quiet
          echo "MOON_HOME=$install_dir" >> "$GITHUB_ENV"
          echo "$install_dir/bin" >> "$GITHUB_PATH"
          moon version --all
      - name: Check format, interfaces, and all supported library backends
        run: |
          moon fmt --check
          moon check --target all --deny-warn
          moon test --target wasm-gc --deny-warn
          moon test --target js --deny-warn
          moon test --target native --deny-warn
          moon info
          git diff --exit-code
      - name: Execute examples and native CLI integration
        run: |
          moon run examples/library
          moon build --target native --release --deny-warn
          node --test tests/cli.test.mjs
          moon run examples/performance --target native --release
